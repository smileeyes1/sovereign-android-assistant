name: بناء تطبيق حكيم الهاتف

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'governance/**'
      - 'scripts/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'governance/**'
      - 'scripts/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4
      - name: بوابة عقد حكيم الوحيد
        run: python3 tests/verify_unified_hakim.py
      - name: بوابة استمرارية هوية التوقيع
        run: |
          python3 tests/verify_signing_continuity_policy.py
          bash -n scripts/verify-field-signer.sh
      - name: إعداد جافا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: بناء نسخة الاختبار ومرشح الإصدار
        run: gradle assembleDebug assembleRelease --stacktrace
      - name: حفظ ملفات البناء
        uses: actions/upload-artifact@v4
        with:
          name: hakim-one-app-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
