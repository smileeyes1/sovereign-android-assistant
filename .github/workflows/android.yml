name: بناء تطبيق حكيم الهاتف

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4
      - name: إعداد جافا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: بناء ملف التثبيت
        run: gradle assembleDebug --stacktrace
      - name: حفظ ملف التثبيت
        uses: actions/upload-artifact@v4
        with:
          name: hakim-phone-agent-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
