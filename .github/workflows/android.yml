name: بناء تطبيق حكيم الهاتف

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'governance/**'
      - 'scripts/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'governance/**'
      - 'scripts/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4
      - name: بوابة عقد حكيم الوحيد
        run: |
          python3 tests/verify_unified_hakim.py
          python3 tests/verify_multimodel_router_policy.py
          python3 tests/verify_hakim_primary_ui.py
          python3 tests/verify_20092_playprotect_safe.py
          python3 tests/verify_20093_no_install_prompt.py
          python3 tests/verify_20094_local_first.py
          python3 tests/verify_20095_android_native.py
          python3 tests/verify_20096_visible_conversation.py
          python3 tests/verify_20097_keyboard_local_help.py
          python3 tests/verify_20098_executive_loop.py
          python3 tests/verify_20099_chatlike_composer.py
          python3 tests/verify_20100_pinned_composer.py
          python3 tests/verify_20101_intent_director.py
          python3 tests/verify_20103_free_intelligence_matrix.py
          python3 tests/verify_20104_quranic_governance.py
          python3 tests/verify_20105_free_oauth_no_handoff.py
          python3 tests/verify_20106_resilient_free_completion.py
          python3 tests/verify_20107_openrouter_browser_loopback.py
          python3 tests/verify_20108_network_guardian.py
          python3 tests/verify_20109_unified_factory.py
          python3 tests/verify_20109_human_biology.py
          python3 tests/verify_20110_execution_fabric.py
          python3 tests/verify_20111_self_improvement_loop.py
          python3 tests/verify_20112_local_pdf.py
          python3 tests/verify_20113_contextual_pdf.py
          python3 tests/verify_20114_silent_tools.py
          python3 tests/verify_sellable_product_candidate.py
          python3 tests/verify_product_screenshot_regression.py
          python3 tests/verify_20206_verified_teacher_artifacts.py
          python3 tests/verify_20207_universal_artifact_pipeline.py
          python3 tests/verify_20300_installability.py
          python3 tests/verify_20301_verified_intake_fabric.py
          python3 tests/verify_20302_hardening_train.py
          python3 tests/verify_20303_core_product.py
          python3 tests/verify_20304_sovereign_constitution.py
          python3 tests/verify_20305_control_channel_recovery.py
          python3 tests/verify_20306_direct_channel.py
          python3 tests/verify_20306_arabic_policy.py
          python3 tests/verify_20307_network_diagnostics.py
          python3 tests/verify_20308_autostart.py
          python3 tests/verify_20309_lan_survey.py
          python3 tests/verify_20310_resilience.py
          python3 tests/verify_enterprise_policy.py
          python3 tests/verify_product_privacy_controls.py
          python3 tests/verify_product_copy.py
          python3 tests/verify_active_state_consistency.py
          python3 tests/verify_product_v1_candidate_gate.py
          set +e
          FINAL_OUTPUT="$(python3 tests/verify_product_v1_final_gate.py 2>&1)"
          FINAL_RC=$?
          set -e
          printf '%s\n' "$FINAL_OUTPUT"
          if [[ $FINAL_RC -eq 0 ]]; then
            echo "Product V1 unexpectedly promoted before field evidence" >&2
            exit 1
          fi
          grep -q 'PRODUCT_V1_FINAL_GATE=FAIL reason=field_state:' <<<"$FINAL_OUTPUT"
          set +e
          SELLABLE_OUTPUT="$(python3 tests/verify_sellable_product_final_gate.py 2>&1)"
          SELLABLE_RC=$?
          set -e
          printf '%s\n' "$SELLABLE_OUTPUT"
          if [[ $SELLABLE_RC -eq 0 ]]; then
            echo "Sellable product unexpectedly promoted before field evidence" >&2
            exit 1
          fi
          grep -q 'SELLABLE_PRODUCT_FINAL=FAIL reason=field_state:' <<<"$SELLABLE_OUTPUT"
      - name: بوابة استمرارية هوية التوقيع
        run: |
          python3 tests/verify_signing_continuity_policy.py
          python3 tests/verify_termux_resilience_policy.py
          python3 tests/verify_capability_kernel_policy.py
          python3 tests/verify_value_continuity_policy.py
          python3 tests/verify_tol_policy.py
          python3 tests/verify_calm_ui_policy.py
          python3 tests/verify_autonomous_resume_policy.py
          python3 tests/verify_religious_integrity_policy.py
          python3 tests/verify_no_premature_stop_policy.py
          python3 tests/verify_no_hypothetical_gate_policy.py
          python3 tests/verify_goal_supervisor_policy.py
          python3 tests/verify_execution_continuity.py
          python3 tests/verify_self_check_continuity.py
          python3 tests/verify_goal_executor_policy.py
          python3 tests/verify_all_things_contract.py
          python3 tests/verify_field_d1_trust_anchor.py
          python3 tests/verify_version_monotonicity.py
          bash -n scripts/verify-field-signer.sh
          bash -n scripts/termux-hakim-adb-bootstrap.sh
          bash -n scripts/hakim-zero-burden-rescue.sh
          bash -n scripts/hakim-termux-resilience.sh
      - name: إعداد جافا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: تحديد إصدار المرشح
        id: candidate_version
        run: |
          VERSION_CODE="$(awk '/versionCode/{print $2; exit}' app/build.gradle)"
          test "$VERSION_CODE" = "20310"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: بناء نسخة الاختبار والنسخة غير الموقعة
        run: gradle assembleDebug assembleRelease --stacktrace
      - name: بوابة توافق صفحات الذاكرة 16KB
        run: |
          ZIPALIGN_BIN="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/zipalign"
          "$ZIPALIGN_BIN" -c -P 16 -v 4 app/build/outputs/apk/release/app-release-unsigned.apk
      - name: إثبات رفض نسخة الاختبار كتحديث ميداني
        run: |
          APKSIGNER_BIN="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner"
          set +e
          GUARD_OUTPUT="$(APKSIGNER="$APKSIGNER_BIN" bash scripts/verify-field-signer.sh app/build/outputs/apk/debug/app-debug.apk 2>&1)"
          GUARD_RC=$?
          set -e
          printf '%s\n' "$GUARD_OUTPUT"
          if [[ $GUARD_RC -eq 0 ]]; then
            echo "Debug APK unexpectedly passed the field signer guard" >&2
            exit 1
          fi
          if ! grep -Eq 'SIGNER_GUARD=FAIL reason=(field_signer_mismatch|known_companion_signer_rejected)' <<<"$GUARD_OUTPUT"; then
            echo "Signer guard failed before completing the certificate comparison" >&2
            exit 1
          fi
      - name: توقيع مرشح الإصدار بهوية حكيم الميدانية عند توفرها
        id: field_sign
        env:
          HAKIM_FIELD_KEYSTORE_B64: ${{ secrets.HAKIM_FIELD_KEYSTORE_B64 }}
          HAKIM_FIELD_KEYSTORE_PASSWORD: ${{ secrets.HAKIM_FIELD_KEYSTORE_PASSWORD }}
          HAKIM_FIELD_KEY_ALIAS: ${{ secrets.HAKIM_FIELD_KEY_ALIAS }}
          HAKIM_FIELD_KEY_PASSWORD: ${{ secrets.HAKIM_FIELD_KEY_PASSWORD }}
        run: |
          if [[ -z "$HAKIM_FIELD_KEYSTORE_B64" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "لم يتوفر مفتاح حكيم الميداني؛ لن يُنشأ APK قابل للتحديث."
            exit 0
          fi
          if [[ -z "$HAKIM_FIELD_KEYSTORE_PASSWORD" || -z "$HAKIM_FIELD_KEY_ALIAS" || -z "$HAKIM_FIELD_KEY_PASSWORD" ]]; then
            echo "بيانات اعتماد توقيع حكيم الميدانية غير مكتملة" >&2
            exit 1
          fi
          printf '%s' "$HAKIM_FIELD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/hakim-field.jks"
          APKSIGNER_BIN="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner"
          "$APKSIGNER_BIN" sign \
            --ks "$RUNNER_TEMP/hakim-field.jks" \
            --ks-key-alias "$HAKIM_FIELD_KEY_ALIAS" \
            --ks-pass env:HAKIM_FIELD_KEYSTORE_PASSWORD \
            --key-pass env:HAKIM_FIELD_KEY_PASSWORD \
            --out app/build/outputs/apk/release/hakim-field-${{ steps.candidate_version.outputs.code }}.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          APKSIGNER="$APKSIGNER_BIN" \
            bash scripts/verify-field-signer.sh app/build/outputs/apk/release/hakim-field-${{ steps.candidate_version.outputs.code }}.apk
          python3 tools/verify_hakim_d1_v2_structure.py \
            app/build/outputs/apk/release/hakim-field-${{ steps.candidate_version.outputs.code }}.apk
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: حفظ ملفات CI غير القابلة للتثبيت الميداني
        uses: actions/upload-artifact@v4
        with:
          name: hakim-ci-NOT-INSTALLABLE
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: حفظ تحديث حكيم الميداني
        if: steps.field_sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hakim-field-${{ steps.candidate_version.outputs.code }}
          path: app/build/outputs/apk/release/hakim-field-${{ steps.candidate_version.outputs.code }}.apk
          if-no-files-found: error
