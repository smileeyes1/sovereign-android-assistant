name: ChatGPT Bridge CI

on:
  push:
    branches:
      - feature/chatgpt-account-native-bridge
      - release/hakim-chatgpt-plugin-v1-rc1
  workflow_dispatch:
    paths:
      - "chatgpt-app/**"
      - "plugins/hakim/**"
      - ".agents/plugins/marketplace.json"
      - "Dockerfile"
      - "railway.toml"
      - ".github/workflows/chatgpt-bridge-ci.yml"
  pull_request:
    paths:
      - "chatgpt-app/**"
      - "plugins/hakim/**"
      - ".agents/plugins/marketplace.json"
      - "Dockerfile"
      - "railway.toml"
      - ".github/workflows/chatgpt-bridge-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatgpt-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify host-independent state backend gate
        working-directory: .
        run: python3 tests/verify_cloud_state_backend.py
      - name: Verify shared-state failover contract
        working-directory: .
        run: python3 tests/verify_shared_state_contract.py
      - name: Build Railway Docker image
        working-directory: .
        run: docker build -t hakim-chatgpt-bridge:test -f Dockerfile .
      - name: Smoke-test local MP4 renderer inside production image
        working-directory: .
        run: |
          docker run --rm --entrypoint node \
            -e HAKIM_VIDEO_RENDER_ENABLED=1 \
            -e HAKIM_VIDEO_EXECUTOR_ADAPTER=local \
            hakim-chatgpt-bridge:test dist/src/local-renderer-smoke.js
