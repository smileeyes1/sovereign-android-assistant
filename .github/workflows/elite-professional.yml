name: بوابة حكيم الفئة العليا المتقاربة

on:
  push:
    branches: [ feature/hakim-governance-editor ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'governance/**'
      - '.github/workflows/elite-professional.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'governance/**'
      - '.github/workflows/elite-professional.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elite-converged-gate:
    runs-on: ubuntu-latest
    steps:
      - name: جلب المصدر
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: إثبات بقاء بوابات الحكمة والخصوصية والصمود وIME معًا
        shell: bash
        run: |
          set -euo pipefail
          required=(
            tests/verify_elite_wisdom_professional.py
            tests/verify_halal_shubuhat_guard.py
            tests/verify_personal_sovereignty.py
            tests/verify_question_science_nstar.py
            tests/verify_taqwa_cultivation.py
            tests/verify_cardiac_safety_policy.py
            tests/verify_innovation_resilience_policy.py
            tests/verify_intent_elevation_policy.py
            tests/verify_quran_candidate_integrity.py
            tests/verify_resource_sovereignty_policy.py
            tests/verify_chat_first_ui.py
            app/src/main/java/ps/hakim/phoneagent/HakimImeResilience.kt
            app/src/main/java/ps/hakim/phoneagent/HakimCrashShield.kt
            app/src/main/java/ps/hakim/phoneagent/HakimUiPolish.kt
          )
          for f in "${required[@]}"; do test -f "$f" || { echo "MISSING $f"; exit 1; }; done

      - name: كل بوابات حكيم تلقائيًا
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test_file in tests/verify_*.py; do
            echo "==> $test_file"
            python3 "$test_file"
            count=$((count + 1))
          done
          test "$count" -ge 42
          echo "ALL_VERIFY_GATES=$count"

      - name: تدقيق فرق المصدر
        run: git diff --check HEAD^

      - name: إعداد Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: بناء Debug وRelease الحقيقي
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Android Lint كامل
        run: gradle lintDebug lintRelease --stacktrace

      - name: إثبات هوية المرشح وفصل المصدر عن الميدان
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/versionCode/{print $2; exit}' app/build.gradle)"
          test "$version" -ge 20035
          grep -q "applicationId 'ps.hakim.stable'" app/build.gradle
          grep -q '"current_field_version": 20040' governance/HAKIM_FIELD_SIGNING_IDENTITY.json
          grep -q "\"current_candidate_version\": $version" governance/HAKIM_FIELD_SIGNING_IDENTITY.json
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: حفظ أثر CI غير القابل للتثبيت الميداني
        uses: actions/upload-artifact@v7
        with:
          name: hakim-converged-${{ steps.candidate.outputs.version }}-ci-NOT-INSTALLABLE
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
          if-no-files-found: error
