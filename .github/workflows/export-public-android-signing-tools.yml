name: Export public Android signing tools

on:
  push:
    branches:
      - release/hakim-20311-extender-survey-candidate
    paths:
      - .github/workflows/export-public-android-signing-tools.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Locate Android build tools
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -f "$BUILD_TOOLS/lib/apksigner.jar"
          test -x "$BUILD_TOOLS/zipalign"
          mkdir -p out/lib
          cp "$BUILD_TOOLS/apksigner" out/apksigner
          cp "$BUILD_TOOLS/lib/apksigner.jar" out/lib/apksigner.jar
          cp "$BUILD_TOOLS/zipalign" out/zipalign
          printf '%s\n' "$(basename "$BUILD_TOOLS")" > out/BUILD_TOOLS_VERSION.txt
          sha256sum out/apksigner out/lib/apksigner.jar out/zipalign > out/SHA256SUMS.txt
      - name: Upload public signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-public-signing-tools
          path: out/
          if-no-files-found: error
          retention-days: 1
