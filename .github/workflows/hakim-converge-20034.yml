name: تقارب حكيم ٢٠٠٣٤ — ٢٠٠٣٣ + طبقات ٢٠٠٢٩

on:
  push:
    branches: [ feature/hakim-convergence-20034 ]
    paths: [ '.github/workflows/hakim-converge-20034.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: جلب ٢٠٠٣٤ كامل التاريخ
        uses: actions/checkout@v7
        with:
          ref: feature/hakim-convergence-20034
          fetch-depth: 0

      - name: دمج طبقات ٢٠٠٢٩ الناقصة بثلاثية آمنة
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hakim-convergence-bot'
          git config user.email 'hakim-convergence-bot@users.noreply.github.com'
          git fetch origin feature/hakim-elite-wisdom-20029:refs/remotes/origin/hakim-elite-wisdom-20029
          BASE=fa795b97a1b5e2e21e17af740be0c2b5e8e7ecdb
          SRC=origin/hakim-elite-wisdom-20029

          new_files=(
            app/src/main/java/ps/hakim/phoneagent/HakimAdaptiveNStarLoop.kt
            app/src/main/java/ps/hakim/phoneagent/HakimDeliberationQuality.kt
            app/src/main/java/ps/hakim/phoneagent/HakimEliteWisdomEngine.kt
            app/src/main/java/ps/hakim/phoneagent/HakimExecutionTransaction.kt
            app/src/main/java/ps/hakim/phoneagent/HakimHalalShubuhatGuard.kt
            app/src/main/java/ps/hakim/phoneagent/HakimPersonalSovereignty.kt
            app/src/main/java/ps/hakim/phoneagent/HakimProfessionalReadiness.kt
            app/src/main/java/ps/hakim/phoneagent/HakimQuestionOperator.kt
            app/src/main/java/ps/hakim/phoneagent/HakimScientificEngineeringKernel.kt
            app/src/main/java/ps/hakim/phoneagent/HakimTaqwaCultivationCycle.kt
            governance/HAKIM_ELITE_PROFESSIONAL_STANDARD.md
            tests/verify_elite_wisdom_professional.py
            tests/verify_halal_shubuhat_guard.py
            tests/verify_personal_sovereignty.py
            tests/verify_question_science_nstar.py
            tests/verify_taqwa_cultivation.py
          )
          for f in "${new_files[@]}"; do git checkout "$SRC" -- "$f"; done

          modified=(
            app/src/main/java/ps/hakim/phoneagent/CommandCenterActivity.kt
            app/src/main/java/ps/hakim/phoneagent/HakimAgentSystem.kt
            app/src/main/java/ps/hakim/phoneagent/HakimAgentsChatActivity.kt
            app/src/main/java/ps/hakim/phoneagent/HakimConstitution.kt
            app/src/main/java/ps/hakim/phoneagent/HakimDecisionMatrix.kt
            app/src/main/java/ps/hakim/phoneagent/HakimExcellenceOptimizer.kt
            app/src/main/java/ps/hakim/phoneagent/HakimReasoningBridge.kt
            app/src/main/java/ps/hakim/phoneagent/HakimReasoningPlanExecutor.kt
            app/src/main/java/ps/hakim/phoneagent/HakimReasoningProtocol.kt
            app/src/main/java/ps/hakim/phoneagent/HakimReligiousIntegrity.kt
            app/src/main/java/ps/hakim/phoneagent/HakimSovereignEngine.kt
            app/src/main/java/ps/hakim/phoneagent/HakimUnifiedRelay.kt
            tests/verify_agent_system.py
            tests/verify_in_app_reasoning.py
            tests/verify_sovereign_intelligence.py
          )
          for f in "${modified[@]}"; do
            git diff --binary "$BASE..$SRC" -- "$f" > /tmp/hakim-one.patch
            if [ -s /tmp/hakim-one.patch ]; then
              echo "APPLY3 $f"
              git apply --3way --index /tmp/hakim-one.patch
            fi
          done

          python3 - <<'PY'
          from pathlib import Path
          import json, re
          p=Path('app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', 'versionCode 20034', s, count=1)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '2.0.34-converged-elite-wisdom-privacy'", s, count=1)
          p.write_text(s)
          p=Path('governance/HAKIM_FIELD_SIGNING_IDENTITY.json')
          data=json.loads(p.read_text())
          data['current_candidate_version']=20034
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')
          PY

          git diff --check
          git add app governance tests
          git status --short
          git commit -m 'حكيم ٢٠٠٣٤: تقارب ٢٠٠٣٣ مع الحكمة والعلوم والتقوى والسيادة الشخصية'
          git push origin HEAD:feature/hakim-convergence-20034
