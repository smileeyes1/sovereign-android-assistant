name: عامل تطوير حكيم السيادي

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: hakim-sovereign-development-worker
  cancel-in-progress: false

env:
  HAKIM_BRIDGE_BASE: https://hakim-chatgpt-bridge-production.up.railway.app
  HAKIM_DEVELOPMENT_BASE: autonomous/hakim-development
  LLAMA_CPP_TAG: "b11193"
  LLAMA_CPP_SHA256: "def277c3a4f0c5e2ec3b1413971878d7d5e7da7eee64f5120a0cd8f024f5a364"
  HAKIM_LOCAL_MODEL_URL: "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/38f6bab61d341b23a6c00226f32c0d6148bf9f43/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
  HAKIM_LOCAL_MODEL_SHA256: "cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046"

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      has_request: ${{ steps.lease.outputs.has_request }}
      request_b64: ${{ steps.lease.outputs.request_b64 }}
      request_id: ${{ steps.lease.outputs.request_id }}
    steps:
      - name: استئجار طلب تطوير واحد
        id: lease
        shell: bash
        run: |
          set -euo pipefail
          oidc_json="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hakim-development-worker")"
          oidc_token="$(jq -er '.value' <<<"$oidc_json")"
          http_code="$(curl --silent --show-error \
            -o lease.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "$HAKIM_BRIDGE_BASE/development/v1/lease")"
          if [[ "$http_code" == "204" ]]; then
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$http_code" == "200" ]] || {
            echo "رفض الجسر طلب العامل: HTTP $http_code" >&2
            cat lease.json >&2 || true
            exit 1
          }
          jq -e '
            .ok == true and
            (.request.request_id | test("^dev-[a-z0-9]+-[0-9a-f]{12}$")) and
            (.request.current_version_code | type == "number") and
            (.request.trigger | IN("field_candidate_regression","self_check_failed","repeated_runtime_failure")) and
            (.request.severity | IN("critical","high")) and
            (.request.fingerprint | test("^[0-9a-f]{64}$")) and
            .request.constraints.source_mutation_on_device == false and
            .request.constraints.github_secret_on_device == false and
            .request.constraints.isolated_branch_required == true and
            .request.constraints.ci_required == true and
            .request.constraints.regression_test_required == true and
            .request.constraints.verified_baseline_required == true and
            .request.constraints.field_install_requires_separate_authorization == true and
            .request.constraints.same_artifact_field_evidence_required == true and
            .request.constraints.no_permission_expansion == true
          ' lease.json >/dev/null
          echo "has_request=true" >> "$GITHUB_OUTPUT"
          echo "request_id=$(jq -r '.request.request_id' lease.json)" >> "$GITHUB_OUTPUT"
          echo "request_b64=$(base64 -w0 lease.json)" >> "$GITHUB_OUTPUT"

  develop:
    needs: intake
    if: needs.intake.outputs.has_request == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      change_state: ${{ steps.package.outputs.change_state }}
    steps:
      - name: تحميل سياسة فحص المرشح من التزام العامل نفسه
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: حفظ بوابة السلامة خارج مساحة تعديل النموذج
        shell: bash
        run: |
          set -euo pipefail
          cp tests/hakim_worker_candidate_gate.py /tmp/hakim-worker-candidate-gate.py
          python3 /tmp/hakim-worker-candidate-gate.py --self-test

      - name: جلب خط التطوير المثبت
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HAKIM_DEVELOPMENT_BASE }}
          fetch-depth: 0
          persist-credentials: false

      - name: تجهيز محرك برمجي محلي صفري الكلفة
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hakim-local-engine
          llama_url="https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_TAG}/llama-${LLAMA_CPP_TAG}-bin-ubuntu-x64.tar.gz"
          curl --fail --location --retry 3 --retry-delay 2 "$llama_url" -o /tmp/hakim-local-engine/llama.tar.gz
          echo "${LLAMA_CPP_SHA256}  /tmp/hakim-local-engine/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/hakim-local-engine/llama.tar.gz -C /tmp/hakim-local-engine
          llama_bin="$(find /tmp/hakim-local-engine -type f -name llama-cli -perm -111 | head -n1)"
          [[ -n "$llama_bin" ]] || { echo "llama-cli غير موجود" >&2; exit 1; }
          curl --fail --location --retry 3 --retry-delay 3 "$HAKIM_LOCAL_MODEL_URL" -o /tmp/hakim-local-engine/model.gguf
          echo "${HAKIM_LOCAL_MODEL_SHA256}  /tmp/hakim-local-engine/model.gguf" | sha256sum -c -
          echo "HAKIM_LLAMA_BIN=$llama_bin" >> "$GITHUB_ENV"
          echo "HAKIM_MODEL_PATH=/tmp/hakim-local-engine/model.gguf" >> "$GITHUB_ENV"
      - name: تجهيز طلب التطوير المحكوم
        shell: bash
        env:
          REQUEST_B64: ${{ needs.intake.outputs.request_b64 }}
        run: |
          set -euo pipefail
          printf '%s' "$REQUEST_B64" | base64 -d > development-lease.json
          jq '.request' development-lease.json > development-request.json
          test -f governance/HAKIM_SOVEREIGN_DEVELOPMENT_CONTRACT.json
          cp governance/HAKIM_SOVEREIGN_DEVELOPMENT_CONTRACT.json /tmp/hakim-development-contract.json
          git status --porcelain=v1 > /tmp/pre-agent-status
          test ! -s /tmp/pre-agent-status

      - name: إعداد سياق سببي محدود
        shell: bash
        run: |
          set -euo pipefail
          trigger="$(jq -r '.trigger' development-request.json)"
          case "$trigger" in
            self_check_failed)
              files=(
                app/src/main/java/ps/hakim/phoneagent/HakimSelfCheck.kt
                app/src/main/java/ps/hakim/phoneagent/HakimFaultContainment.kt
                app/src/main/java/ps/hakim/phoneagent/HakimExecutionFabric.kt
                app/src/main/java/ps/hakim/phoneagent/HakimDevelopmentControlPlane.kt
                tests/verify_development_control_plane.py
              )
              ;;
            repeated_runtime_failure)
              files=(
                app/src/main/java/ps/hakim/phoneagent/HakimLearning.kt
                app/src/main/java/ps/hakim/phoneagent/HakimFaultContainment.kt
                app/src/main/java/ps/hakim/phoneagent/HakimGoalExecutor.kt
                app/src/main/java/ps/hakim/phoneagent/HakimExecutionFabric.kt
                tests/verify_20310_resilience.py
              )
              ;;
            field_candidate_regression)
              files=(
                app/src/main/java/ps/hakim/phoneagent/HakimSelfImprovementLoop.kt
                app/src/main/java/ps/hakim/phoneagent/HakimFieldAcceptance.kt
                app/src/main/java/ps/hakim/phoneagent/AutoUpdater.kt
                app/src/main/java/ps/hakim/phoneagent/HakimHealthBeacon.kt
                tests/verify_20111_self_improvement_loop.py
                tests/verify_20316_autoupdate_wakeup.py
              )
              ;;
            *) echo "محفز غير معروف" >&2; exit 1 ;;
          esac

          {
            echo "=== DEVELOPMENT REQUEST ==="
            cat development-request.json
            echo
            echo "=== SOVEREIGN DEVELOPMENT CONTRACT ==="
            cat governance/HAKIM_SOVEREIGN_DEVELOPMENT_CONTRACT.json
            echo
            echo "=== RELEVANT SOURCE ==="
            for file in "${files[@]}"; do
              [[ -f "$file" ]] || continue
              echo
              echo "--- FILE: $file ---"
              sed -n '1,1400p' "$file"
            done
          } > /tmp/hakim-local-context.txt

          python3 tests/verify_unified_hakim.py >/tmp/hakim-preflight.txt 2>&1 || true

      - name: اقتراح patch بواسطة نموذج محلي معزول
        id: local_model
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/hakim-worker-instruction.txt <<'PROMPT'
          أنت مهندس برمجيات محلي داخل مصنع تطوير حكيم. لا تملك أي صلاحية تنفيذ أو كتابة أو شبكة أو GitHub.
          مهمتك الوحيدة تحليل السياق التالي واقتراح unified diff واحد صغير إن كان هناك سبب جذري واضح ومادي.

          قواعد إلزامية:
          - لا تخترع عيبًا غير مدعوم بالدليل.
          - إن كان الدليل غير كافٍ، أخرج فقط: NO_SAFE_PATCH
          - أصلح السبب الجذري بأصغر تغيير قابل للرجوع.
          - يجب أن يتضمن أي تعديل كود اختبار انحدار مناسب.
          - ممنوع تعديل .github أو release-control أو عقد الحوكمة أو التوقيع أو الإصدار أو النشر.
          - ممنوع تغيير applicationId/versionCode/versionName أو Android permissions.
          - ممنوع توسيع التحكم البعيد أو الحدود الأمنية أو صلاحيات المستخدم.
          - ممنوع حذف أو إضعاف اختبار كي يمر التغيير.
          - ممنوع إضافة خدمة أو تبعية مدفوعة.
          - لا تكتب شرحًا أو Markdown إذا اقترحت patch.
          - إذا اقترحت patch فاستخدم بالضبط:
            BEGIN_PATCH
            <git unified diff>
            END_PATCH

          السياق:
          PROMPT
          cat /tmp/hakim-local-context.txt >> /tmp/hakim-worker-instruction.txt
          echo >> /tmp/hakim-worker-instruction.txt
          echo "=== PRE-FLIGHT TEST ===" >> /tmp/hakim-worker-instruction.txt
          cat /tmp/hakim-preflight.txt >> /tmp/hakim-worker-instruction.txt

          "$HAKIM_LLAMA_BIN" -m "$HAKIM_MODEL_PATH" \
            -p "$(cat /tmp/hakim-worker-instruction.txt)" \
            -c 32768 -n 4096 --temp 0.1 \
            > /tmp/hakim-model-output.txt 2>/tmp/hakim-model-stderr.txt

          python3 - <<'PY'
          from pathlib import Path
          raw=Path("/tmp/hakim-model-output.txt").read_text(encoding="utf-8",errors="replace")
          if "BEGIN_PATCH" not in raw or "END_PATCH" not in raw:
              Path("candidate.patch").write_text("",encoding="utf-8")
              Path("candidate-meta.json").write_text('{"state":"defer","reason":"safe_patch_not_found"}',encoding="utf-8")
              raise SystemExit(0)
          patch=raw.rsplit("BEGIN_PATCH",1)[1].split("END_PATCH",1)[0].strip()+"\n"
          Path("candidate.patch").write_text(patch,encoding="utf-8")
          Path("candidate-meta.json").write_text('{"state":"candidate"}',encoding="utf-8")
          PY

          if [[ ! -s candidate.patch ]]; then
            echo "model_state=defer" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git apply --check candidate.patch; then
            : > candidate.patch
            printf '%s\n' '{"state":"defer","reason":"safe_patch_not_found"}' > candidate-meta.json
            echo "model_state=defer" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git apply candidate.patch
          echo "model_state=candidate" >> "$GITHUB_OUTPUT"
      - name: بوابة التغيير الآمن
        id: package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.local_model.outputs.model_state }}" == "defer" ]]; then
            echo "change_state=defer" >> "$GITHUB_OUTPUT"
            [[ -f candidate.patch ]] || : > candidate.patch
            [[ -f candidate-meta.json ]] || printf '%s\n' '{"state":"defer","reason":"safe_patch_not_found"}' > candidate-meta.json
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 0 )); then
            echo "change_state=defer" >> "$GITHUB_OUTPUT"
            : > candidate.patch
            printf '%s\n' '{"state":"defer","reason":"safe_patch_not_found"}' > candidate-meta.json
            exit 0
          fi

          trigger="$(jq -r '.trigger' development-request.json)"
          python3 /tmp/hakim-worker-candidate-gate.py --trigger "$trigger" > changed-files.txt
          mapfile -t approved < changed-files.txt
          [[ "${#approved[@]}" -eq "${#changed[@]}" ]] || { echo "قائمة التغيير غير متطابقة" >&2; exit 1; }
          forbidden='^(\.github/|release-control/|governance/|scripts/|Dockerfile$|railway\.toml$|build\.gradle$|settings\.gradle$|gradle\.properties$|app/build\.gradle$|app/src/main/AndroidManifest\.xml$|app/src/main/java/ps/hakim/phoneagent/(HakimUnifiedRelay|HakimRemoteApprovalReceiver|HakimAccessibilityService|HakimCapabilityKernel|HakimConstitution|HakimAcceptanceGate|HakimSelfImprovementLoop|HakimFieldAcceptance|AutoUpdater|HakimApp)\.kt$)'
          if grep -Eq "$forbidden" changed-files.txt; then
            echo "رفض: محاولة تعديل مسار محمي" >&2
            cat changed-files.txt >&2
            exit 1
          fi

          if git diff -- app/build.gradle | grep -Eq '^[+-].*(versionCode|versionName|applicationId)'; then
            echo "رفض: تغيير هوية/إصدار التطبيق" >&2
            exit 1
          fi

          if git diff -- app/src/main/AndroidManifest.xml | grep -Eq '^[+-].*uses-permission'; then
            echo "رفض: تغيير صلاحيات Android" >&2
            exit 1
          fi

          test_changed=false
          for file in "${changed[@]}"; do
            case "$file" in
              tests/*|chatgpt-app/tests/*|*Test.kt|*Tests.kt) test_changed=true ;;
            esac
          done
          [[ "$test_changed" == "true" ]] || {
            echo "رفض: لا يوجد اختبار انحدار مع تعديل الكود" >&2
            exit 1
          }

          git diff --check
          python3 tests/verify_unified_hakim.py
          if [[ -f tests/verify_development_control_plane.py ]]; then
            python3 tests/verify_development_control_plane.py
          fi

          git diff --binary > candidate.patch
          jq -n \
            --arg state "changed" \
            --arg base_sha "$(git rev-parse HEAD)" \
            --arg request_id "$(jq -r '.request_id' development-request.json)" \
            --arg trigger "$(jq -r '.trigger' development-request.json)" \
            --arg patch_sha256 "$(sha256sum candidate.patch | cut -d' ' -f1)" \
            '{state:$state,base_sha:$base_sha,request_id:$request_id,trigger:$trigger,patch_sha256:$patch_sha256}' > candidate-meta.json
          echo "change_state=changed" >> "$GITHUB_OUTPUT"

      - name: حفظ المرشح دون صلاحية كتابة للمستودع
        uses: actions/upload-artifact@v4
        with:
          name: hakim-development-candidate-${{ github.run_id }}
          path: |
            candidate.patch
            candidate-meta.json
            changed-files.txt
          if-no-files-found: ignore
          retention-days: 2

  publish:
    needs: [intake, develop]
    if: needs.intake.outputs.has_request == 'true' && needs.develop.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    steps:
      - name: تحميل سياسة فحص المرشح من التزام العامل نفسه
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: حفظ بوابة السلامة خارج مساحة تعديل النموذج
        shell: bash
        run: |
          set -euo pipefail
          cp tests/hakim_worker_candidate_gate.py /tmp/hakim-worker-candidate-gate.py
          python3 /tmp/hakim-worker-candidate-gate.py --self-test

      - name: جلب خط التطوير
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HAKIM_DEVELOPMENT_BASE }}
          fetch-depth: 0

      - name: تنزيل المرشح
        uses: actions/download-artifact@v4
        with:
          name: hakim-development-candidate-${{ github.run_id }}
          path: /tmp/hakim-candidate

      - name: معالجة النتيجة ونشر المرشح بعد CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ needs.intake.outputs.request_id }}
          CHANGE_STATE: ${{ needs.develop.outputs.change_state }}
        run: |
          set -euo pipefail

          get_oidc() {
            curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hakim-development-worker" |
              jq -er '.value'
          }

          acknowledge() {
            local outcome="$1"
            local sha="${2:-}"
            local pr="${3:-}"
            local token
            token="$(get_oidc)"
            jq -n \
              --arg outcome "$outcome" \
              --arg sha "$sha" \
              --argjson pr "${pr:-null}" \
              '{
                outcome:$outcome
              } + (if $sha=="" then {} else {result_sha:$sha} end)
                + (if $pr==null then {} else {pr_number:$pr} end)' > /tmp/ack.json
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/ack.json \
              "$HAKIM_BRIDGE_BASE/development/v1/$REQUEST_ID/complete" >/dev/null
          }

          if [[ "$CHANGE_STATE" == "defer" ]]; then
            token="$(get_oidc)"
            jq -n '{reason:"safe_patch_not_found",delay_ms:1800000}' > /tmp/defer.json
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/defer.json \
              "$HAKIM_BRIDGE_BASE/development/v1/$REQUEST_ID/defer" >/dev/null
            exit 0
          fi

          cp /tmp/hakim-candidate/candidate.patch .
          jq -e --arg base "$(git rev-parse HEAD)" --arg id "$REQUEST_ID" \
            '.state == "changed" and .base_sha == $base and .request_id == $id and (.patch_sha256 | test("^[a-f0-9]{64}$"))' \
            /tmp/hakim-candidate/candidate-meta.json >/dev/null
          expected_patch_sha="$(jq -er '.patch_sha256' /tmp/hakim-candidate/candidate-meta.json)"
          actual_patch_sha="$(sha256sum candidate.patch | cut -d' ' -f1)"
          [[ "$expected_patch_sha" == "$actual_patch_sha" ]] || { echo "المرشح لا يطابق بصمته" >&2; exit 1; }
          git apply --check candidate.patch
          git apply candidate.patch
          git diff --check
          trigger="$(jq -er '.trigger' /tmp/hakim-candidate/candidate-meta.json)"
          python3 /tmp/hakim-worker-candidate-gate.py --trigger "$trigger" > /tmp/approved-worker-paths.txt
          mapfile -t safe_paths < /tmp/approved-worker-paths.txt
          (( ${#safe_paths[@]} >= 2 )) || { echo "لم تجتز الملفات بوابة المصدر والاختبار" >&2; exit 1; }

          branch="auto/hakim-dev-${REQUEST_ID//:/-}"
          branch="${branch//[^A-Za-z0-9._\/-]/-}"
          git switch -c "$branch"
          git config user.name "hakim-development-worker[bot]"
          git config user.email "hakim-development-worker[bot]@users.noreply.github.com"
          git add -- "${safe_paths[@]}"
          diff -u /tmp/approved-worker-paths.txt <(git diff --cached --name-only)
          git commit -m "fix: Hakim autonomous development $REQUEST_ID"
          candidate_sha="$(git rev-parse HEAD)"
          git push origin "$branch"

          pr_url="$(gh pr create \
            --draft \
            --base "$HAKIM_DEVELOPMENT_BASE" \
            --head "$branch" \
            --title "حكيم: إصلاح ذاتي محكوم $REQUEST_ID" \
            --body "مرشح مولّد من طلب تطوير حكيم المحكوم. لا يمثل نجاحًا ميدانيًا. يلزم CI كامل، ولا يمنح أي صلاحية تثبيت أو نشر ميداني.")"
          pr_number="$(gh pr view "$pr_url" --json number --jq '.number')"

          # Mark the candidate pending review BEFORE a potentially long CI run.
          # The bridge must support this endpoint (companion draft PR #311).
          review_token="$(get_oidc)"
          jq -n --arg sha "$candidate_sha" --argjson pr "$pr_number" \
            '{result_sha:$sha,pr_number:$pr}' > /tmp/review-pending.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $review_token" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/review-pending.json \
            "$HAKIM_BRIDGE_BASE/development/v1/$REQUEST_ID/review-pending" \
            > /tmp/review-pending-response.json
          jq -e --arg sha "$candidate_sha" --argjson pr "$pr_number" \
            '.ok == true and .state == "review_pending" and .result_sha == $sha and .pr_number == $pr' \
            /tmp/review-pending-response.json > /dev/null

          gh workflow run android.yml --ref "$branch"

          run_id=""
          for _ in {1..20}; do
            run_id="$(gh run list \
              --workflow android.yml \
              --branch "$branch" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \\"$candidate_sha\\") | .databaseId" |
              head -n1)"
            [[ -n "$run_id" ]] && break
            sleep 3
          done
          [[ -n "$run_id" ]] || {
            gh pr comment "$pr_number" --body "تعذّر العثور على تشغيل CI؛ المرشح باقٍ للمراجعة، لا دمج أو اعتماد." || true
            echo "تعذر العثور على تشغيل CI للمرشح" >&2
            exit 1
          }

          if ! gh run watch "$run_id" --exit-status; then
            gh pr comment "$pr_number" --body "فشل CI الكامل؛ لم يُدمج المرشح ولم يصل إلى الخط الميداني."
            echo "HAKIM_WORKER_CI_FAILED_REVIEW_PENDING pr=$pr_number sha=$candidate_sha"
            exit 1
          fi

          gh pr comment "$pr_number" --body "نجح CI المصدر فقط. لا دمج آلي ولا اعتماد ميداني. حالة الجسر review_pending ولا تُعد نجاحًا نهائيًا؛ ينتظر المرشح مراجعة أمنية مستقلة وموافقة صريحة."
          echo "HAKIM_WORKER_RESULT=PENDING_INDEPENDENT_REVIEW pr=$pr_number sha=$candidate_sha"
          # Do not send a fabricated /complete outcome or an unverified /defer reason.

  acknowledge-agent-failure:
    needs: [intake, develop]
    if: always() && needs.intake.outputs.has_request == 'true' && needs.develop.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: تحرير الطلب بعد فشل العامل
        shell: bash
        env:
          REQUEST_ID: ${{ needs.intake.outputs.request_id }}
        run: |
          set -euo pipefail
          oidc_json="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hakim-development-worker")"
          token="$(jq -er '.value' <<<"$oidc_json")"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data '{"reason":"transient_runner_failure","delay_ms":1800000}' \
            "$HAKIM_BRIDGE_BASE/development/v1/$REQUEST_ID/defer" >/dev/null || true
