          ma3eA9LRc7HJZDCZvuXjH/rsEK0rswRSB1tnAg4tsCEMLvYTR8M/KvjL/VACMthQ
          fQFDdG26Ws+NLdPS4Ip1EHTu5Tvu/qfmjqBymKq5qedpNdwMCGOHKhtB4FmYZYh/
          VPBdewUcbz4g8nhV5WSSfoB5as9/wW4/nrMiC/MfxFgWYBJdc91RykrVDbVkfB9v
          3T/lfq0Vg/ETNhXcRnhgxHVdSEqSZD2IPrpegAUC7l/+SHPwnaG0ALRoFbt9ZS79
          B44V/Atw0dhmjFodlZ/W5a72k/tGhp7jdAPB
          -----END CERTIFICATE-----
          CERT
          mkdir -p "$RUNNER_TEMP/hakim-delivery"
          openssl cms -encrypt -binary -aes-256-gcm -in "$APK" -outform DER -out "$RUNNER_TEMP/hakim-delivery/candidate.cms" "$DIR/recipient.pem"
          printf '%s\n' "$STATE" > "$RUNNER_TEMP/hakim-delivery/status.txt"
          sha256sum "$APK" | awk '{print $1}' > "$RUNNER_TEMP/hakim-delivery/apk.sha256"
          echo "CANDIDATE_STATE=$STATE"
      - uses: actions/upload-artifact@v4
        with:
          name: hakim-encrypted-candidate
          path: ${{ runner.temp }}/hakim-delivery/
          retention-days: 7
          if-no-files-found: error
