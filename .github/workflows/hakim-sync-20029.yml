name: مزامنة حكيم ٢٠٠٢٩ الذرية

on:
  push:
    branches: [ feature/hakim-elite-wisdom-20029 ]
    paths:
      - '.github/workflows/hakim-sync-20029.yml'

permissions:
  contents: write

jobs:
  sync-exact-local-tree:
    runs-on: ubuntu-latest
    steps:
      - name: جلب الفرع
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: صحح الجزء الأول وتحقق من البايتات
        shell: bash
        run: |
          set -euo pipefail
          size="$(wc -c < .hakim-sync/part0)"
          if [ "$size" = "50368" ]; then
            head -c 12592 .hakim-sync/part0 > /tmp/part0.correct
            mv /tmp/part0.correct .hakim-sync/part0
          fi
          test "$(wc -c < .hakim-sync/part0)" = "12592"
          echo 'cc29f4e2d6bf2deec5728211867a7e8014e92d99ddfa88f7116e86fe0a74471e  .hakim-sync/part0' | sha256sum -c -
          test "$(git hash-object .hakim-sync/part0)" = "9ddc2ce656fabde35cf95ca44a0a50ed44e49d74"

      - name: تحقق من حزمة النقل وطبقها
        shell: bash
        run: |
          set -euo pipefail
          cat .hakim-sync/part0 .hakim-sync/part1 .hakim-sync/part2 .hakim-sync/part3 > /tmp/hakim.b64
          echo 'a09ae5aa7d01f8c7f51b2cc97a81127db8f7212cdc3796ee31dc937e9401ef3f  /tmp/hakim.b64' | sha256sum -c -
          base64 -d /tmp/hakim.b64 | gzip -d > /tmp/hakim.patch
          echo 'd2f534faa6c40234e8003a5cac25679d185c4e34dec509354b646711d3a7025a  /tmp/hakim.patch' | sha256sum -c -
          git apply --check /tmp/hakim.patch
          git apply /tmp/hakim.patch

      - name: ادفع المصدر دون ملفات Workflow
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/elite-professional.yml .hakim-elite-professional.yml.stage
          rm -f .github/workflows/elite-professional.yml
          git checkout HEAD -- .github/workflows/hakim-sync-20029.yml
          rm -rf .hakim-sync
          rm -f tmp-ignore.txt
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'حكيم ٢٠٠٢٩: مزامنة المصدر المتحقق مع فصل بوابة Actions'
          git push origin HEAD:feature/hakim-elite-wisdom-20029
