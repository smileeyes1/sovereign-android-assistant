name: "تثبيت حكيم ٢٠٣١٥ — القطعة الميدانية نفسها بلا إشارة هاتف"

on:
  push:
    branches:
      - publish/hakim-20315-autonomy-d1
    paths:
      - .github/workflows/publish-20315-autonomy.yml
      - release-control/20315-field-verified-signing-block.b64
      - tools/reconstruct_20315_field_verified.py
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: جلب أثر CI 1280 المطابق للميدان
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/smileeyes1/sovereign-android-assistant/actions/artifacts/11051412509/zip" \
            -o /tmp/hakim-ci.zip
          unzip -q /tmp/hakim-ci.zip -d /tmp/hakim-ci
          test -f /tmp/hakim-ci/release/app-release-unsigned.apk
          echo "e3c7822bfb1f4f33ba1b3ef8b2e0cb73c30b1abbecec6fd1220e7b44469f0c70  /tmp/hakim-ci/release/app-release-unsigned.apk" | sha256sum -c -
          test "$(stat -c %s /tmp/hakim-ci/release/app-release-unsigned.apk)" = "14149090"

      - name: إعادة تركيب APK المثبت ميدانيا حرفيا
        run: |
          set -euo pipefail
          base64 -d release-control/20315-field-verified-signing-block.b64 > /tmp/block.bin
          echo "1b0f719c990234abb2155cee5bd992c7fc3342a0de3a955101263d09db7ba4fa  /tmp/block.bin" | sha256sum -c -
          test "$(stat -c %s /tmp/block.bin)" = "2624"
          python3 tools/reconstruct_20315_field_verified.py \
            /tmp/hakim-ci/release/app-release-unsigned.apk \
            release-control/20315-field-verified-signing-block.b64 \
            /tmp/HAKIM-20315-D1-AUTONOMY.apk
          python3 tools/verify_hakim_d1_v2_structure.py /tmp/HAKIM-20315-D1-AUTONOMY.apk
          echo "43b26f82a9a5ab24c919ebafadfef986d791015f2e06497bb37bab9388d83491  /tmp/HAKIM-20315-D1-AUTONOMY.apk" | sha256sum -c -
          test "$(stat -c %s /tmp/HAKIM-20315-D1-AUTONOMY.apk)" = "14151714"
          unzip -t /tmp/HAKIM-20315-D1-AUTONOMY.apk >/dev/null

      - name: اجعل القطعة الميدانية هي أصل الإصدار وتحقق بالدورة الكاملة
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="hakim-20315-d1-autonomy"
          ASSET="HAKIM-20315-D1-AUTONOMY.apk"
          EXPECTED="sha256:43b26f82a9a5ab24c919ebafadfef986d791015f2e06497bb37bab9388d83491"
          CURRENT="$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name=="HAKIM-20315-D1-AUTONOMY.apk") | .digest' || true)"
          if [ "$CURRENT" != "$EXPECTED" ]; then
            gh release delete-asset "$TAG" "$ASSET" -y || true
            gh release upload "$TAG" "/tmp/$ASSET#$ASSET"
          fi
          gh release edit "$TAG" --notes "حكيم ٢٠٣١٥ — القطعة الميدانية نفسها المثبتة والمتحقق منها على الهاتف. المصدر: الرأس 7bce31720b39bd6e3fd7134a67658eb25ea966b2، CI #1280 / run 36606143472 / artifact 11051412509. SHA-256: 43b26f82a9a5ab24c919ebafadfef986d791015f2e06497bb37bab9388d83491. D1/v2. تحقق ميداني: الاتصال والتعافي وقاطع الدائرة وSelf-Check. لا توجد إشارة تحديث هاتف في هذا التشغيل."
          URL="https://github.com/smileeyes1/sovereign-android-assistant/releases/download/$TAG/$ASSET"
          curl --fail --location --silent --show-error "$URL" -o /tmp/roundtrip.apk
          echo "43b26f82a9a5ab24c919ebafadfef986d791015f2e06497bb37bab9388d83491  /tmp/roundtrip.apk" | sha256sum -c -
          test "$(stat -c %s /tmp/roundtrip.apk)" = "14151714"
          python3 tools/verify_hakim_d1_v2_structure.py /tmp/roundtrip.apk
          echo "FIELD_VERIFIED_RELEASE=PASS"
          echo "PHONE_UPDATE_SIGNAL=NOT_SENT"
