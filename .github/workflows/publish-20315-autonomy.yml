name: "نشر حكيم ٢٠٣١٥ — إصلاح الأصل بلا إشارة هاتف"

on:
  push:
    branches:
      - publish/hakim-20315-autonomy-d1
    paths:
      - .github/workflows/publish-20315-autonomy.yml
      - release-control/20315-autonomy-signing-block-v2-verified.b64
      - tools/reconstruct_20315_autonomy.py
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: جلب أثر CI 1281 المثبت
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/smileeyes1/sovereign-android-assistant/actions/artifacts/11051287470/zip" \
            -o /tmp/hakim-ci.zip
          echo "edc941fb62e2a0efa21e57f46b15bc9762b52c9f25ca87c1310871117190814f  /tmp/hakim-ci.zip" | sha256sum -c -
          unzip -q /tmp/hakim-ci.zip -d /tmp/hakim-ci
          echo "479bd4bcbcefcc27cb1948d09b36e1c102682d39e755e32c319bc2d42629f6a4  /tmp/hakim-ci/release/app-release-unsigned.apk" | sha256sum -c -

      - name: إعادة تركيب نفس APK D1 المصحح
        run: |
          set -euo pipefail
          base64 -d release-control/20315-autonomy-signing-block-v2-verified.b64 > /tmp/block.bin
          echo "2e1af7dbd8e4a2e8caf3b77ca5274b4c398e1b815b540e2fbda7943dbba3ecb8  /tmp/block.bin" | sha256sum -c -
          test "$(stat -c %s /tmp/block.bin)" = "2624"
          python3 tools/reconstruct_20315_autonomy.py \
            /tmp/hakim-ci/release/app-release-unsigned.apk \
            release-control/20315-autonomy-signing-block-v2-verified.b64 \
            /tmp/HAKIM-20315-D1-AUTONOMY.apk
          python3 tools/verify_hakim_d1_v2_structure.py /tmp/HAKIM-20315-D1-AUTONOMY.apk
          echo "27667e0a8b410b4edf2eb68b0f001d8dfcd4df2045c92554696d52920f7f33a2  /tmp/HAKIM-20315-D1-AUTONOMY.apk" | sha256sum -c -
          test "$(stat -c %s /tmp/HAKIM-20315-D1-AUTONOMY.apk)" = "14151714"
          unzip -t /tmp/HAKIM-20315-D1-AUTONOMY.apk >/dev/null

      - name: استبدال الأصل الخاطئ والتحقق
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="hakim-20315-d1-autonomy"
          ASSET="HAKIM-20315-D1-AUTONOMY.apk"
          EXPECTED="sha256:27667e0a8b410b4edf2eb68b0f001d8dfcd4df2045c92554696d52920f7f33a2"
          CURRENT="$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name=="HAKIM-20315-D1-AUTONOMY.apk") | .digest' || true)"
          if [ "$CURRENT" != "$EXPECTED" ]; then
            gh release delete-asset "$TAG" "$ASSET" -y || true
            gh release upload "$TAG" "/tmp/$ASSET#$ASSET"
          fi
          gh release edit "$TAG" --notes "مرشح ٢٠٣١٥ من أثر CI #1281، موقّع بهوية D1 نفسها. الأصل المصحح SHA-256: 27667e0a8b410b4edf2eb68b0f001d8dfcd4df2045c92554696d52920f7f33a2. لا توجد إشارة تحديث هاتف في هذا التشغيل."
          URL="https://github.com/smileeyes1/sovereign-android-assistant/releases/download/$TAG/$ASSET"
          curl --fail --location --silent --show-error "$URL" -o /tmp/roundtrip.apk
          echo "27667e0a8b410b4edf2eb68b0f001d8dfcd4df2045c92554696d52920f7f33a2  /tmp/roundtrip.apk" | sha256sum -c -
          echo "RELEASE_REPAIR=PASS"
          echo "PHONE_UPDATE_SIGNAL=NOT_SENT"
