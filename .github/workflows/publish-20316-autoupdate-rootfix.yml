name: "نشر حكيم ٢٠٣١٦ — إصلاح استيقاظ التحديث"

on:
  push:
    branches:
      - publish/hakim-20316-autoupdate-rootfix-d1
    paths:
      - .github/workflows/publish-20316-autoupdate-rootfix.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: جلب شجرة النشر
        uses: actions/checkout@v4

      - name: جلب أثر CI 1292 المثبت
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/smileeyes1/sovereign-android-assistant/actions/artifacts/11059049070/zip" \
            -o /tmp/hakim-ci.zip
          echo "7b59e94e125a62ce4ffc36753fc9061c9a8aabed98bd34a9dd40b4fe5491b7e4  /tmp/hakim-ci.zip" | sha256sum -c -
          unzip -q /tmp/hakim-ci.zip -d /tmp/hakim-ci
          test -f /tmp/hakim-ci/release/app-release-unsigned.apk
          echo "9fa73a168adb211ceeea056885c42e89944345010883473aea00b22e3d346913  /tmp/hakim-ci/release/app-release-unsigned.apk" | sha256sum -c -
          test "$(stat -c %s /tmp/hakim-ci/release/app-release-unsigned.apk)" = "14149130"

      - name: إعادة تركيب APK D1 المطابق بلا مفتاح خاص
        run: |
          set -euo pipefail
          python3 tools/reconstruct_20316_autoupdate_rootfix.py \
            /tmp/hakim-ci/release/app-release-unsigned.apk \
            release-control/20316-autoupdate-rootfix-signing-block.b64 \
            /tmp/HAKIM-20316-D1-AUTOUPDATE-ROOTFIX.apk
          python3 tools/verify_hakim_d1_v2_structure.py /tmp/HAKIM-20316-D1-AUTOUPDATE-ROOTFIX.apk
          echo "383f356a66ac171caabc105a68fe7c89a035ddad55da7310aae014b119e6faa8  /tmp/HAKIM-20316-D1-AUTOUPDATE-ROOTFIX.apk" | sha256sum -c -
          test "$(stat -c %s /tmp/HAKIM-20316-D1-AUTOUPDATE-ROOTFIX.apk)" = "14153226"
          unzip -t /tmp/HAKIM-20316-D1-AUTOUPDATE-ROOTFIX.apk >/dev/null

      - name: نشر الأصل المطابق في GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="hakim-20316-d1-autoupdate-rootfix"
          APK="HAKIM-20316-D1-AUTOUPDATE-ROOTFIX.apk"
          EVIDENCE="HAKIM-20316-D1-AUTOUPDATE-ROOTFIX.verification.json"
          TARGET="c585a7def11d0312a7e7fbba2f854e960fb3127c"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$TARGET" \
              --title "Hakim 20316 D1 — AutoUpdater Wakeup Root Fix" \
              --notes "مرشح ٢٠٣١٦ الموقّع بهوية D1 من أثر CI #1292 المطابق للرأس c585a7d. يغلق سبب عدم استيقاظ AutoUpdater عبر بدء التطبيق والإقلاع والتعافي والفحص الدوري، من دون إضافة تثبيت صامت. يبقى غير ميداني حتى تثبيت نفس SHA والتحقق الحي." \
              --prerelease
          fi

          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$APK"; then
            gh release upload "$TAG" "/tmp/$APK#$APK"
          fi
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$EVIDENCE"; then
            gh release upload "$TAG" "release-control/$EVIDENCE#$EVIDENCE"
          fi

          URL="https://github.com/smileeyes1/sovereign-android-assistant/releases/download/$TAG/$APK"
          curl --fail --location --silent --show-error "$URL" -o /tmp/roundtrip.apk
          echo "383f356a66ac171caabc105a68fe7c89a035ddad55da7310aae014b119e6faa8  /tmp/roundtrip.apk" | sha256sum -c -
          echo "GITHUB_RELEASE_ROUNDTRIP=PASS"
          echo "PHONE_SIGNAL_SENT=false"
