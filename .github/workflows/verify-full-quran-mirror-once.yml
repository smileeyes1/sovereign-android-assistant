name: تحقق القرآن الكامل من مرآة KFQC المثبتة

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/verify-full-quran-mirror-once.yml'

permissions:
  contents: read

jobs:
  verify-full-quran-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: جلب quran-meta على commit مثبت
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/quran-center/quran-meta.git quran-meta
          git -C quran-meta checkout --detach a5dd4a46dc6f7830a4303e89c3b4b3a15a213ac9
          test "$(git -C quran-meta rev-parse HEAD)" = "a5dd4a46dc6f7830a4303e89c3b4b3a15a213ac9"
          mkdir -p out
          cp quran-meta/examples/data-check/data/hafsData_v2-0.json out/hafsData_v2-0.json

      - name: مسح كامل ١١٤ سورة و٦٢٣٦ آية وحفظ SQLite
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sqlite3, hashlib, os
          from collections import defaultdict

          src="out/hafsData_v2-0.json"
          with open(src,"r",encoding="utf-8-sig") as f:
              obj=json.load(f)
          if isinstance(obj, dict):
              for key in ("data","ayat","aya","verses","rows"):
                  if isinstance(obj.get(key), list):
                      obj=obj[key]; break
          if not isinstance(obj,list) or not obj:
              raise SystemExit("INVALID_JSON_SHAPE")

          rows=[]
          for raw in obj:
              r={str(k).strip().lower():v for k,v in raw.items()}
              s=int(str(r["sura_no"]).strip())
              a=int(str(r["aya_no"]).strip())
              name=str(r.get("sura_name_ar","")).strip()
              text=str(r.get("aya_text","")).strip()
              imlaey=str(r.get("aya_text_emlaey","")).strip()
              if not text:
                  raise SystemExit(f"EMPTY_TEXT:{s}:{a}")
              rows.append((s,a,name,text,imlaey))

          if len(rows)!=6236: raise SystemExit(f"AYA_COUNT:{len(rows)}")
          keys={(s,a) for s,a,_,_,_ in rows}
          if len(keys)!=6236: raise SystemExit(f"UNIQUE_KEYS:{len(keys)}")
          surahs=sorted({s for s,_,_,_,_ in rows})
          if surahs!=list(range(1,115)): raise SystemExit("SURAH_RANGE")

          by=defaultdict(list)
          for row in rows: by[row[0]].append(row)
          counts={}
          for s in range(1,115):
              vv=sorted(by[s],key=lambda x:x[1])
              got=[x[1] for x in vv]
              if got!=list(range(1,len(vv)+1)): raise SystemExit(f"SEQUENCE:{s}")
              counts[str(s)]=len(vv)

          if counts["87"]!=19: raise SystemExit(f"AL_ALA_COUNT:{counts['87']}")

          sha_file=hashlib.sha256(open(src,"rb").read()).hexdigest()
          h=hashlib.sha256()
          for s,a,name,text,imlaey in sorted(rows):
              h.update(f"{s}\t{a}\t{name}\t{text}\t{imlaey}\n".encode())
          sha_corpus=h.hexdigest()

          db="out/hakim-quran-verified.sqlite"
          con=sqlite3.connect(db)
          con.execute("CREATE TABLE aya (sura_no INTEGER NOT NULL, aya_no INTEGER NOT NULL, sura_name_ar TEXT NOT NULL, aya_text TEXT NOT NULL, aya_text_emlaey TEXT NOT NULL, PRIMARY KEY(sura_no,aya_no))")
          con.executemany("INSERT INTO aya VALUES (?,?,?,?,?)",rows)
          con.execute("CREATE INDEX idx_aya_sura ON aya(sura_no,aya_no)")
          con.commit()
          check=con.execute("SELECT COUNT(*), COUNT(DISTINCT sura_no) FROM aya").fetchone()
          ala=con.execute("SELECT aya_no,aya_text FROM aya WHERE sura_no=87 ORDER BY aya_no").fetchall()
          con.close()
          if check!=(6236,114) or len(ala)!=19: raise SystemExit("SQLITE_VERIFY")

          ah=hashlib.sha256()
          for a,text in ala: ah.update(f"87\t{a}\t{text}\n".encode())
          ala_sha=ah.hexdigest()

          manifest={
            "verification":"PASS",
            "source_repository":"quran-center/quran-meta",
            "source_commit":"a5dd4a46dc6f7830a4303e89c3b4b3a15a213ac9",
            "source_file":"examples/data-check/data/hafsData_v2-0.json",
            "declared_upstream":"https://download.qurancomplex.gov.sa/resources_dev/UthmanicHafs_v2-0.zip",
            "declared_upstream_authority":"King Fahd Glorious Quran Printing Complex",
            "exact_official_zip_hash_verified_in_this_run":False,
            "mirror_file_sha256":sha_file,
            "canonical_corpus_sha256":sha_corpus,
            "scanned_every_row":True,
            "ayah_count":6236,
            "unique_ayah_keys":6236,
            "surah_count":114,
            "surah_range":[1,114],
            "surah_ayah_counts":counts,
            "surah_al_ala":{"number":87,"ayah_count":19,"sha256":ala_sha},
            "reading_mode":"deterministic_full_row_scan_not_human_recitation",
            "memorization_mode":"persistent_verified_storage_not_model_weight_memorization",
            "tafsir_claimed":False,
            "spiritual_effect_claimed":False
          }
          with open("out/full-quran-mirror-verification.json","w",encoding="utf-8") as f:
              json.dump(manifest,f,ensure_ascii=False,indent=2)
          with open("out/hafsData_v2-0.json.sha256","w") as f:
              f.write(sha_file+"  hafsData_v2-0.json\n")
          with open("out/hakim-quran-verified.sqlite.sha256","w") as f:
              f.write(hashlib.sha256(open(db,"rb").read()).hexdigest()+"  hakim-quran-verified.sqlite\n")
          print("FULL_QURAN_MIRROR_SCAN_114_6236=PASS")
          print("SURAH_AL_ALA_19=PASS")
          print("CORPUS_SHA256="+sha_corpus)
          PY

      - name: إثبات نسبة المصدر إلى KFQC من README المثبت
        run: |
          set -euo pipefail
          grep -Fq 'hafsData_v2-0.json' quran-meta/README.md
          grep -Fq 'download.qurancomplex.gov.sa/resources_dev/UthmanicHafs_v2-0.zip' quran-meta/README.md
          cp quran-meta/README.md out/quran-meta-source-README.md

      - name: رفع النسخة المحفوظة ودليل المسح
        uses: actions/upload-artifact@v7
        with:
          name: hakim-quran-full-scan-mirror-kfqc-derived
          path: out/
          if-no-files-found: error
          retention-days: 90
