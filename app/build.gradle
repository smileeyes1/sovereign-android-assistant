plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ps.hakim.phoneagent'
    compileSdk 35

    defaultConfig {
        applicationId 'ps.hakim.stable'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 20091
        versionName '2.0.91-direct-relay'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

// Robolectric runs on a host JVM. The Android-only Conscrypt native AAR cannot
// be loaded there; exclude it from *test runtime only*, not from the production APK.
configurations.configureEach {
    if (name.endsWith("UnitTestRuntimeClasspath")) {
        exclude group: 'org.conscrypt', module: 'conscrypt-android'
    }
}

dependencies {
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    testRuntimeOnly 'org.conscrypt:conscrypt-openjdk-uber:2.5.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
}
