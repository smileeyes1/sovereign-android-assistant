plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ps.hakim.phoneagent'
    compileSdk 36

    defaultConfig {
        applicationId 'ps.hakim.stable'
        minSdk 26
        targetSdk 36
        versionCode 20338
        versionName '3.5.0-product-foundation-v1-capability-fabric-r28'
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions += "distribution"

    productFlavors {
        advanced {
            dimension "distribution"
            applicationId 'ps.hakim.stable'
            buildConfigField "boolean", "HAKIM_ADVANCED", "true"
            buildConfigField "String", "HAKIM_DISTRIBUTION_CHANNEL", '"advanced"'
            versionNameSuffix "-advanced"
        }
        consumer {
            dimension "distribution"
            applicationId 'ps.hakim.app'
            buildConfigField "boolean", "HAKIM_ADVANCED", "false"
            buildConfigField "String", "HAKIM_DISTRIBUTION_CHANNEL", '"consumer"'
            versionNameSuffix "-consumer"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-ktx:1.12.4'
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
}
