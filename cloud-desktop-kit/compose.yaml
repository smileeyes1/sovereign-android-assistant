name: hakim-cloud-desktop
services:
  desktop:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: hakim-cloud-desktop
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: Asia/Hebron
      CUSTOM_USER: "${DESKTOP_USER}"
      PASSWORD: "${DESKTOP_PASSWORD}"
    volumes:
      - ./desktop-data:/config
    ports:
      - "127.0.0.1:3000:3000"
    shm_size: "1gb"
    restart: unless-stopped
